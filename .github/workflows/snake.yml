name: Update contribution snake

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github&color_snake=#8b5cf6
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4b5fd

      - name: Publish generated SVGs
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg
          git switch --orphan output
          mv dist/snake.svg dist/snake-dark.svg .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- snake.svg snake-dark.svg
          git commit -m 'Update contribution snake'
          git push --force origin HEAD:refs/heads/output
